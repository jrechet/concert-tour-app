<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concert Tour Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard.css') }}">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <h1>Concert Tour Dashboard</h1>

            <!--
                No concert-create or setlist page/route exists on `main` yet:
                only the JSON `/api/v1/tours/` API and unused Concert schemas
                are implemented, there is no Concert router, setlist model,
                or any HTML page for either. Rather than invent URLs, these
                actions are rendered disabled until those routes land.
            -->
            <div class="quick-actions" aria-label="Quick actions">
                <a id="quick-action-add-concert"
                   class="btn btn-primary is-disabled"
                   href="#"
                   role="button"
                   aria-disabled="true"
                   tabindex="-1"
                   title="Not yet available: no concert-create route exists on main">
                    Add Concert
                </a>
                <a id="quick-action-view-setlist"
                   class="btn btn-secondary is-disabled"
                   href="#"
                   role="button"
                   aria-disabled="true"
                   tabindex="-1"
                   title="Not yet available: no setlist route exists on main">
                    View Setlist
                </a>
            </div>
        </header>

        <main class="dashboard-main">
            <section id="tour-overview" class="card tour-overview" aria-label="Tour overview"
                     hx-get="/api/v1/dashboard/tours"
                     hx-trigger="load"
                     hx-swap="innerHTML">
                <div id="tour-name" class="tour-name">Loading tour&hellip;</div>
                <div id="tour-dates" class="tour-dates"></div>
                <div id="tour-progress" class="tour-progress">
                    <div class="progress-bar">
                        <div class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                </div>
            </section>

            <section id="stats-cards" class="stats-grid" aria-label="Tour statistics"
                     hx-get="/api/v1/dashboard/stats"
                     hx-trigger="load"
                     hx-swap="innerHTML">
                <div id="stat-concerts" class="stat-card">
                    <span class="stat-label">Concerts</span>
                    <span class="stat-value">&mdash;</span>
                </div>
                <div id="stat-cities" class="stat-card">
                    <span class="stat-label">Cities</span>
                    <span class="stat-value">&mdash;</span>
                </div>
                <div id="stat-countries" class="stat-card">
                    <span class="stat-label">Countries</span>
                    <span class="stat-value">&mdash;</span>
                </div>
                <div id="stat-capacity" class="stat-card">
                    <span class="stat-label">Total Capacity</span>
                    <span class="stat-value">&mdash;</span>
                </div>
                <div id="stat-revenue" class="stat-card">
                    <span class="stat-label">Projected Revenue</span>
                    <span class="stat-value">&mdash;</span>
                </div>
            </section>

            <div id="concert-search" class="concert-search" role="search">
                <label for="artist-search-input" class="concert-search-label">Search by artist</label>
                <input type="search"
                       id="artist-search-input"
                       name="artist_name"
                       class="concert-search-input"
                       placeholder="Search by artist name&hellip;"
                       autocomplete="off"
                       aria-label="Search concerts by artist name"
                       hx-get="/api/v1/dashboard/concerts"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-include="#hide-cancelled-checkbox"
                       hx-target="#calendar-grid"
                       hx-swap="innerHTML">
                <label class="concert-hide-cancelled-label">
                    <input type="checkbox"
                           id="hide-cancelled-checkbox"
                           name="include_cancelled"
                           value="false"
                           hx-get="/api/v1/dashboard/concerts"
                           hx-trigger="change"
                           hx-include="#artist-search-input"
                           hx-target="#calendar-grid"
                           hx-swap="innerHTML">
                    Masquer les dates annulées
                </label>
            </div>

            <div id="city-search" class="concert-search" role="search">
                <label for="city-search-input" class="concert-search-label">Filter by city</label>
                <input type="search"
                       id="city-search-input"
                       name="city"
                       class="concert-search-input"
                       placeholder="Filter by city"
                       autocomplete="off"
                       aria-label="Filter concerts by city">
                <label for="city-filter-select" class="concert-search-label">City</label>
                <select id="city-filter-select"
                        name="city"
                        class="concert-search-select"
                        aria-label="Filter concerts by city">
                    <option value="">All cities</option>
                </select>
            </div>

            <section id="calendar-grid" class="calendar-grid" aria-label="Concert calendar"
                     hx-get="/api/v1/dashboard/concerts"
                     hx-trigger="load"
                     hx-swap="innerHTML">
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', path='js/concert-search.js') }}"></script>
</body>
</html>
