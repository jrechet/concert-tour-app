# How this project shows itself when the swarm demos a cycle.
# Without this, QA guesses: "/", "/docs", "/health" plus one page per
# router — which on this app are JSON responses, so the demo card showed
# payloads instead of the dashboard the feature actually changed.
demo:
  # A database of its own for every demo server: the workspace's outlives
  # cycles, and the demo used to show what QA's E2E runs left behind
  # (tour 1 at "revenue 0.00, 0 concerts" on the tour-revenue demo).
  command: "{python} -m uvicorn src.main:app --host 127.0.0.1 --port {port}"
  env:
    DATABASE_URL: "sqlite:///{tmp}/demo.db"
  pages:
    - "/dashboard"
    - "/"
  # Run once the demo server answers (TheSwarm `demo.seed`): an empty
  # database gets a small tour schedule, so the dashboard and the pages a
  # cycle adds (/api/v1/concerts/1/...) have something to show.
  seed:
    - "{python} scripts/seed_demo.py"
